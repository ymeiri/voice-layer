name: Bug report
description: Report a reproducible voice-layer bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private messages, real voice profiles, credentials, or company data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
      placeholder: |
        1. Run ...
        2. Ask ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Claude Code direct skill
        - Codex direct skill
        - Claude Code plugin
        - Codex plugin
        - CLI installer
        - Profile validator
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: voice-layer version
      placeholder: v0.1.0
